<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HUHS AI MBTI TEST</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="container">

  <!-- 시작 화면 -->
  <div id="start">

  <img
    src="images/huhs_logo.png"
    alt="HUHS 로고"
    class="club-logo"
  >

  <div class="logo">
    HANYANG UNIVERSITY HARDWARE & SOFTWARE · HUHS
  </div>

    <h1>🤖 개발자 MBTI TEST</h1>

    <p class="sub">
      당신의 응답 패턴을 분석해<br>
      MBTI를 예측합니다.
    </p>

    <p class="sub">
      총 20문항 · 약 2분 소요
    </p>

    <button class="main-btn" onclick="startTest()">
      MBTI 검사하기 →
    </button>
  </div>


  <!-- 질문 화면 -->
  <div id="quiz" class="hidden">

    <div class="progress">
      <div id="progress" class="progress-inner"></div>
    </div>

    <div id="questionNumber" class="question-number"></div>

    <h2 id="question"></h2>

    <div class="answers">
      <button class="answer-btn" onclick="answer(2)">
        매우 그렇다
      </button>

      <button class="answer-btn" onclick="answer(1)">
        그렇다
      </button>

      <button class="answer-btn" onclick="answer(0)">
        보통이다
      </button>

      <button class="answer-btn" onclick="answer(-1)">
        그렇지 않다
      </button>

      <button class="answer-btn" onclick="answer(-2)">
        전혀 그렇지 않다
      </button>
    </div>

  </div>


  <!-- 분석 화면 -->
  <div id="loading" class="hidden">
    <div class="loading">
      <div class="loading-icon">🤖</div>

      <div id="loadingMessage">
        응답 패턴을 분석하고 있습니다...
      </div>
    </div>
  </div>


  <!-- 검사 완료 후 홍보 화면 -->
  <div id="promotion" class="hidden">

    <aside class="club-promo" aria-labelledby="club-promo-title">
      <div class="club-promo-brand">
        <img src="images/huhs_logo.png" alt="HUHS 로고" width="48" height="48">
        <span>한양대학교 중앙 컴퓨터 동아리</span>
      </div>
      <h2 id="club-promo-title" tabindex="-1">이런 웹사이트,<br>나도 쉽게 만들어보고 싶다면?</h2>
      <p>어떻게 만드는지 궁금하다면<br><strong>HUHS 부스로 구경 오세요!</strong></p>
      <figure class="club-map">
        <a class="club-map-link" href="images/huhs-booth-map.jpg" target="_blank" rel="noopener noreferrer" aria-label="43번 부스 배치도 원본 크게 보기 (새 탭)">
          <img src="images/huhs-booth-map.jpg" width="880" height="542" alt="학생회관 아래 중앙 대각선 줄, 42번과 44번 사이가 HUHS 43번 부스입니다.">
          <span class="club-map-marker" aria-hidden="true"></span>
        </a>
        <figcaption>한마당 43번 부스</figcaption>
      </figure>
      <p class="club-welcome">테스트만 하고 도망가면 섭섭함<br>부스 오면 간식도 드려요 !!</p>
    </aside>
    <p class="result-ready">분석이 완료됐어요. 나의 개발자 유형을 확인해보세요!</p>
    <button type="button" class="main-btn result-view-btn" onclick="showResult()">
      내 MBTI 결과 보기 →
    </button>
  </div>

  <!-- 버튼을 누른 뒤 표시하는 결과 화면 -->
  <div id="result" class="hidden">
    <div class="result-title" id="result-heading" tabindex="-1">
      당신의 MBTI는
    </div>

    <div id="mbtiResult" class="mbti"></div>

    <div id="description" class="description"></div>

    <div id="dimensions"></div>

    <button class="main-btn" onclick="restart()">
      🔄 다시 검사하기
    </button>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
